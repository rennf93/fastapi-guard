name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  # One job for every language, so the required check context is exactly `code-ql` (a matrix would suffix it
  # with the language).
  code-ql:
    name: code-ql
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python,actions

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          # The category of the earlier `analyze` job, so the existing analyses and alerts carry over.
          category: .github/workflows/code-ql.yml:analyze/language:python
